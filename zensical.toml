        ]},
        { "VGGT On gfx1103" = [
            { "VGGT Overview" = "Tutorial_for_This_Project/VGGT_on_gfx1103/VGGT_Overview.md" },
            { "PyTorch" = "Tutorial_for_This_Project/VGGT_on_gfx1103/PyTorch.md" },
            { "Profiling and Benchmarking" = "Tutorial_for_This_Project/VGGT_on_gfx1103/Profiling_and_Benchmarking.md" }
