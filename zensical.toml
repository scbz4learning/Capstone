[project]

site_name = "Accelerating Robotics Perception on AMD Ryzen AI APU"
site_description = "A new project generated from the default template project."
site_author = "Bokai Sun"

copyright = """
Copyright &copy; 2026 Bokai Sun
"""

nav = [
    { "Accelerating Robotics Perception on AMD Ryzen AI APU" = "index.md" },
    { "Architecture" = [
        { "Overview" = ["Architecture/index.md"] },
        { "NPU Inference" = "Architecture/1_npu-inference.md" },
        { "GPU Inference" = "Architecture/2_gpu-inference.md" },
        { "CPU Inference" = "Architecture/3_cpu-inference.md" },
        { "Inference Frameworks" = [
            { "PyTorch" = "Architecture/Inference_Frameworks/pytorch.md" },
            { "ONNX Runtime" = "Architecture/Inference_Frameworks/onnxruntime.md" }
        ]}
    ]},
    { "Environment Setup" = [
        { "Prerequisite" = ["Environment_Setup/Prerequisite/index.md"] },
        { "Drivers" = ["Environment_Setup/Drivers/index.md"] },
        { "Accelerated Backends" = [
            { "ROCm" = "Environment_Setup/Accelerated_Backends/rocm/index.md" },
            { "Vulkan" = "Environment_Setup/Accelerated_Backends/vulkan/index.md" },
            { "Ryzen AI" = "Environment_Setup/Accelerated_Backends/ryzen-ai/index.md" }
        ]}
    ]},
    { "SmoLVLM" = [
        { "Overview" = ["smolvlm/index.md"] },
        { "PyTorch" = "smolvlm/0.pytorch.md" }
    ] },
    { "VGGT" = [
        { "Overview" = ["vggt/index.md"] },
        { "PyTorch" = "vggt/0.pytorch.md" }
    ] },
    { "Profiling & Benchmarking" = [
        { "Overview" = ["Profiling/index.md"] }
    ] },
    { "Appendix" = [
        { "Known Issues" = "Appendix/known-issues.md" },
        { "Developer Guide" = [
            { "Overview" = ["Appendix/developer-guide/index.md"] },
            { "IREE" = "Appendix/developer-guide/iree.md" }
        ] }
    ] }
]

[project.theme]

language = "en"

features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[markdown]
extensions = ["pymdownx.betterlists"]

[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/scbz4learning/Capstone"